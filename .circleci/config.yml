# =============================================================================
# CircleCI Video HLS Processor & Converter Pipeline
# =============================================================================

version: 2.1

parameters:
  PAYLOAD_JSON:
    type: string
    default: ""
  VIDEO_URL:
    type: string
    default: ""
  WEBHOOK_URL:
    type: string
    default: ""
  CDN_DOMAIN:
    type: string
    default: ""
  USERNAME:
    type: string
    default: ""
  CUSTOM_ID:
    type: string
    default: ""
  QUALITIES:
    type: string
    default: ""
  STORAGE_HOST:
    type: string
    default: ""
  STORAGE_USER:
    type: string
    default: ""
  STORAGE_PASS:
    type: string
    default: ""
  STORAGE_PORT:
    type: string
    default: "22"
  TARGET_DIR:
    type: string
    default: "hls"
  WEB_DIR:
    type: string
    default: ""
  ENABLE_SPRITE:
    type: string
    default: "0"
  ENCRYPT:
    type: string
    default: "0"
  KEY_URL:
    type: string
    default: ""

executors:
  linux-large:
    machine:
      image: ubuntu-2204:current
    resource_class: large

jobs:
  convert-video:
    executor: linux-large
    steps:
      - checkout
      - restore_cache:
          keys:
            - static-all-v4-{{ arch }}
            - static-all-v4
      - run:
          name: Setup Dependencies (FFmpeg, Aria2, SSHPass)
          command: |
            mkdir -p "$HOME/bin"
            export PATH="$HOME/bin:$PATH"
            
            # 1. Statik FFmpeg & FFprobe (John Van Sickle)
            if ! which ffmpeg >/dev/null 2>&1 || ! which ffprobe >/dev/null 2>&1; then
              echo "Statik FFmpeg indiriliyor ve önbelleğe alınıyor..."
              curl -sL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar -xJ --strip-components=1 -C "$HOME/bin" --wildcards "*/ffmpeg" "*/ffprobe" 2>/dev/null || true
              chmod +x "$HOME/bin/ffmpeg" "$HOME/bin/ffprobe" 2>/dev/null || true
            fi

            # 2. Aria2 & SSHPass
            if ! which aria2c >/dev/null 2>&1 || ! which sshpass >/dev/null 2>&1 || ! aria2c --version >/dev/null 2>&1; then
              echo "Aria2 & SSHPass kuruluyor..."
              sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends aria2 sshpass
            fi
      - run:
          name: Install Python Requirements
          command: |
            python3 -m pip install -q -r circlecivideocdn/requirements.txt || true
      - save_cache:
          key: static-all-v4-{{ arch }}
          paths:
            - ~/bin
            - ~/.cache/pip
      - run:
          name: Execute Video HLS Converter
          command: |
            export PATH="$HOME/bin:$PATH"
            cat \<< 'EOF_PAYLOAD' > /tmp/circleci_payload.json
            << pipeline.parameters.PAYLOAD_JSON >>
            EOF_PAYLOAD
            echo "=== CircleCI Video Converter Başlatılıyor ==="
            python3 -m circlecivideocdn.runner --payload-file /tmp/circleci_payload.json
      - run:
          name: Fallback Failure Webhook
          when: on_fail
          command: |
            python3 -c "
            import os, json, urllib.request
            wh, cid, vid = None, None, os.environ.get('CIRCLE_WORKFLOW_ID', os.environ.get('CIRCLE_BUILD_NUM', 'unknown'))
            if os.path.exists('/tmp/circleci_payload.json'):
                try:
                    p = json.load(open('/tmp/circleci_payload.json'))
                    wh = p.get('webhook_url')
                    cid = p.get('custom_id')
                    vid = p.get('video_id') or vid
                except Exception:
                    pass
            if not wh:
                wh = '''<< pipeline.parameters.WEBHOOK_URL >>'''.strip() or None
                cid = '''<< pipeline.parameters.CUSTOM_ID >>'''.strip() or None
            if wh:
                body = json.dumps({
                    'status': 'failed',
                    'step': 'pipeline_failed',
                    'progress': 0,
                    'runner': 'circleci',
                    'custom_id': cid,
                    'video_id': str(vid),
                    'error': 'CircleCI pipeline job failed or was aborted',
                    'message': 'CircleCI pipeline aşamasında bir hata oluştu veya işlem durduruldu.'
                }).encode('utf-8')
                req = urllib.request.Request(wh, data=body, headers={'Content-Type': 'application/json'})
                try:
                    urllib.request.urlopen(req, timeout=8)
                    print('[FALLBACK] CircleCI hata webhook bildirimi başarıyla iletildi.')
                except Exception as e:
                    print('Fallback webhook error:', e)
            " 2>/dev/null || true

workflows:
  version: 2
  video-processing-workflow:
    when:
      or:
        - not:
            equal: [ "", << pipeline.parameters.PAYLOAD_JSON >> ]
        - not:
            equal: [ "", << pipeline.parameters.VIDEO_URL >> ]
    jobs:
      - convert-video
