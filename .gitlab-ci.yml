# =============================================================================
# GitLab CI/CD Video HLS Processor & Converter Pipeline
# =============================================================================

stages:
  - convert

variables:
  DEBIAN_FRONTEND: "noninteractive"
  PYTHONUNBUFFERED: "1"

video_convert_job:
  stage: convert
  image: ubuntu:22.04
  timeout: 2h
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: manual
  script:
    - "apt-get update -qq"
    - "apt-get install -y --no-install-recommends curl aria2 rsync sshpass openssh-client xz-utils ca-certificates python3 python3-pip python3-requests python3-psutil ffmpeg"
    - "python3 -m pip install -q -r gitlabvideocdn/requirements.txt || true"
    - "echo '=== GitLab CI/CD Video Converter Başlatılıyor ==='"
    - "python3 -m gitlabvideocdn.runner"
