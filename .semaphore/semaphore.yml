# =============================================================================
# Semaphore CI Video HLS Processor & Converter Pipeline
# =============================================================================

version: v1.0
name: Video HLS Processor Pipeline
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204

blocks:
  - name: "Video Convert & Upload"
    task:
      jobs:
        - name: "HLS Converter"
          commands:
            - checkout
            - which aria2c >/dev/null 2>&1 && which ffmpeg >/dev/null 2>&1 && which sshpass >/dev/null 2>&1 || (sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends aria2 ffmpeg sshpass)
            - python3 -m pip install -q --no-cache-dir requests psutil || true
            - echo "=== Semaphore CI Video Converter Başlatılıyor ==="
            - python3 -m semaphorevideocdn.runner
