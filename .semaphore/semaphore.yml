# =============================================================================
# Semaphore CI Video HLS Processor & Converter Pipeline
# =============================================================================

version: v1.0
name: Video HLS Processor Pipeline
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204

blocks:
  - name: "Video Convert & Upload"
    task:
      jobs:
        - name: "HLS Converter"
          commands:
            - checkout
            - export PATH="$HOME/bin:$PATH"
            - cache restore static-tools-v4 || true
            - |
              # 1. Statik FFmpeg & FFprobe (100% Bağımsız - John Van Sickle)
              if ! which ffmpeg >/dev/null 2>&1 || ! which ffprobe >/dev/null 2>&1; then
                echo "Statik FFmpeg kuruluyor..."
                curl -sL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar -xJ --strip-components=1 -C "$HOME/bin" --wildcards "*/ffmpeg" "*/ffprobe" 2>/dev/null || true
                chmod +x "$HOME/bin/ffmpeg" "$HOME/bin/ffprobe" 2>/dev/null || true
              fi
              # 2. Aria2 & SSHPass (Resmi Ubuntu Paketleri)
              if ! which aria2c >/dev/null 2>&1 || ! which sshpass >/dev/null 2>&1 || ! aria2c --version >/dev/null 2>&1; then
                echo "Aria2 & SSHPass kuruluyor..."
                sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
                sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends aria2 sshpass
              fi
              cache store static-tools-v4 "$HOME/bin" "$HOME/.cache/pip" || true
            - python3 -m pip install -q --no-cache-dir requests psutil || true
            - echo "=== Semaphore CI Video Converter Başlatılıyor ==="
            - python3 -m semaphorevideocdn.runner
      epilogue:
        on_fail:
          commands:
            - |
              python3 -c "
              import os, json, urllib.request
              payload_raw = os.environ.get('PAYLOAD_JSON', '')
              wh = os.environ.get('WEBHOOK_URL', '')
              cid = os.environ.get('CUSTOM_ID', '')
              vid = os.environ.get('VIDEO_ID', '')
              if payload_raw:
                  try:
                      p = json.loads(payload_raw)
                      wh = wh or p.get('webhook_url')
                      cid = cid or p.get('custom_id')
                      vid = vid or p.get('video_id')
                  except Exception:
                      pass
              if wh:
                  body = json.dumps({
                      'status': 'failed',
                      'step': 'pipeline_failed',
                      'progress': 0,
                      'runner': 'semaphore-ci',
                      'custom_id': cid,
                      'video_id': vid or os.environ.get('SEMAPHORE_WORKFLOW_ID', 'unknown'),
                      'error': 'Pipeline execution failed (CI job aborted or crashed)',
                      'message': 'Semaphore CI pipeline aşamasında bir hata oluştu ve işlem tamamlanamadı.'
                  }).encode('utf-8')
                  req = urllib.request.Request(wh, data=body, headers={'Content-Type': 'application/json'})
                  try:
                      urllib.request.urlopen(req, timeout=8)
                      print('[FALLBACK] Pipeline hata webhook bildirimi başarıyla iletildi.')
                  except Exception as e:
                      print('Fallback webhook error:', e)
              " 2>/dev/null || true
