# =============================================================================
# Semaphore CI Video HLS Processor & Converter Pipeline
# =============================================================================

version: v1.0
name: Video HLS Processor Pipeline
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204

blocks:
  - name: "Video Convert & Upload"
    task:
      jobs:
        - name: "HLS Converter"
          commands:
            - checkout
            - sudo apt-get update -qq
            - sudo apt-get install -y --no-install-recommends curl aria2 rsync sshpass openssh-client xz-utils ca-certificates python3 python3-pip python3-requests python3-psutil ffmpeg
            - python3 -m pip install -q -r semaphorevideocdn/requirements.txt || true
            - echo "=== Semaphore CI Video Converter Başlatılıyor ==="
            - python3 -m semaphorevideocdn.runner
